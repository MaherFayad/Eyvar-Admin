<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Eyvar">
  <!--
    The maskable icon. Android crops this to a platform shape, so the tile is
    full-bleed and the mark must sit inside the 40%-radius safe circle
    (r=204.8 at 512).

    That circle is why this is scaled to 0.85 of the "any" icon rather than
    sharing its transform. The mark is taller than it is wide, so its corner —
    not its edge — is what the crop reaches first: at the full scale the
    half-diagonal is 205.3, which is OUTSIDE the safe circle by half a pixel and
    would clip the smile's end on a circular mask. At 0.85 it is 174.5, which
    survives a circle, a squircle and a teardrop with room to spare.

    translate = (512 - 24 * 18.1333) / 2, which re-centres the shrunk box.
  -->
  <rect width="512" height="512" fill="#0c6944"/>
  <g transform="translate(38.4,38.4) scale(18.1333)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.4 5V9.6a4.6 4.6 0 0 0 9.2 0V5M7.9 16.6a4.7 4.7 0 0 0 8.2 0"/>
  </g>
</svg>
