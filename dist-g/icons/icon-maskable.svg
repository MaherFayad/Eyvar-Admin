<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Eyvar">
  <!--
    The maskable icon. Android crops this to a platform shape, so the tile is
    full-bleed and the mark sits inside the 40%-radius safe circle (r=204.8 at
    512). The mark's half-diagonal here is ~144, so it survives a circle, a
    squircle and a teardrop crop with room to spare.
  -->
  <rect width="512" height="512" fill="#0c6944"/>
  <g transform="translate(-8,-13.5) scale(22)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7.5 7.5l4.5 6.2 4.5-6.2M12 13.7V17"/>
  </g>
</svg>
